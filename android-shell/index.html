<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grafictrader</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #0e0e0f; color: #f5f5f7; text-align: center; padding: 24px; box-sizing: border-box; }
    b { display: block; font-size: 20px; margin-bottom: 8px; }
    p { color: #8e8e93; line-height: 1.5; }
    button { margin-top: 16px; height: 48px; padding: 0 24px; border: 0; border-radius: 14px; background: #f5f5f7; color: #0e0e0f; font-weight: 700; font-size: 15px; }
  </style>
</head>
<body>
  <div>
    <b>Sem ligação ao Grafictrader</b>
    <p>Verifica a tua internet e tenta de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
