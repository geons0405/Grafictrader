<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <meta name="theme-color" content="#efeeea" />
  <meta name="description" content="Grafictrader — gráficos ao vivo, leitura técnica, mecânica de mercado e análise de gráficos por IA." />
  <title>Grafictrader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash.
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('grafictrader.theme') || 'system'; } catch (e) {}
      var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body class="booting is-public">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
