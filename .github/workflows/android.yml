name: Android APK

on:
  push:
    branches: [main, claude/app-inspection-analysis-mqt9rz]
    paths:
      - 'android/**'
      - 'android-shell/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Sync Capacitor
        run: npx cap sync android

      # A signed release build when the signing secrets exist (not debuggable,
      # same key every time). Otherwise a debug build, only good for testing.
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../Grafictrader.apk
          else
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: APK de debug (só para testes)."
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../Grafictrader.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Grafictrader-apk
          path: Grafictrader.apk

      # Same download link every time: the "android-latest" release is replaced on each build.
      # Only builds of main reach users; branch builds just check that the app compiles.
      - name: Publish download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Grafictrader.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Grafictrader para Android" \
            --notes "APK gerado automaticamente a partir de ${GITHUB_SHA::7} (${GITHUB_REF_NAME}).

          Instalar: abre o ficheiro Grafictrader.apk no telemóvel e permite instalar apps de origem desconhecida.
          A app abre https://grafictrader.vercel.app e, em Minha corretora, analisa o ecrã da tua corretora com uma bolha por cima.

          Operações e orientações são educativas e não são aconselhamento financeiro."
