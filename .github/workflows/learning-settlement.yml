name: GraficTrader learning settlement

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grafictrader-learning-settlement
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Settle due market observations
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Add the same CRON_SECRET used by Vercel as a GitHub Actions repository secret."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 55 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://grafictrader.vercel.app/api/instructor?cron=1&learning=1"
